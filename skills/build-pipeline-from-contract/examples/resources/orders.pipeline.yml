resources:
  pipelines:
    orders_pipeline:
      name: orders_pipeline
      catalog: ${var.catalog}
      schema: ${resources.schemas.commerce.name}
      serverless: true
      channel: CURRENT
      root_path: ../src/pipeline
      libraries:
        - glob:
            include: ../src/pipeline/**
      configuration:
        source_catalog: ${var.catalog}
        source_schema: ${var.source_schema}
