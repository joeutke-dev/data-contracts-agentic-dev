# slo.refresh/timezone -> schedule; contract domain/tags/version -> tags; slo.alert -> email_notifications.
resources:
  jobs:
    loyalty_sales_refresh:
      name: loyalty_sales_refresh
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"   # slo.refresh: 5:00, an hour before the 6 AM report (PRD B4)
        timezone_id: America/Chicago            # from the comment on slo.refresh
        pause_status: UNPAUSED
      tags:
        domain: marketing
        data_product: daily_store_loyalty_sales
        contract_version: "1.0.0"
      email_notifications:
        on_failure:
          - ${var.alert_email}
          - ${var.alert_email_2}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - databricks-sdk>=0.97.0   # data_quality API
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.loyalty_sales_pipeline.id}
            full_refresh: false

        - task_key: governance
          depends_on: [{task_key: refresh_pipeline}]
          environment_key: default
          spark_python_task:
            python_file: ../src/governance.py
            parameters:
              - --table=${var.catalog}.${var.schema}.daily_store_loyalty_sales
              - --reader-group=${var.reader_group}
              - --tags=${var.tag_prefix}domain=marketing,${var.tag_prefix}data_product=daily_store_loyalty_sales,${var.tag_prefix}contract_version=1.0.0,${var.tag_prefix}tags=marketing|loyalty|store-sales

        - task_key: enable_dqm
          depends_on: [{task_key: refresh_pipeline}]
          environment_key: default
          spark_python_task:
            python_file: ../src/enable_dqm.py
            parameters:
              - --schema=${var.catalog}.${var.schema}
              - --profile-table=${var.catalog}.${var.schema}.daily_store_loyalty_sales
              - --timestamp-column=sales_date
              - --warehouse-id=${var.warehouse_id}
              - --assets-dir=${workspace.root_path}/monitoring
